name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests with coverage
        env:
          VITE_PIZZA_SERVICE_URL: http://localhost:3000
          VITE_PIZZA_FACTORY_URL: https://pizza-factory.cs329.click
        run: npm run test:coverage

      - name: Update coverage badge
        env:
          NET_ID: ${{ secrets.NET_ID }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(awk -v coverage="$coverage" 'BEGIN { print coverage < 80 ? "red" : "green" }')
          curl --fail-with-body -sS -X POST \
            "https://pizza-factory.cs329.click/api/badge/${NET_ID}/jwtpizzacoverage?label=Coverage&value=${coverage}%25&color=${color}" \
            -H "authorization: bearer ${FACTORY_API_KEY}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            playwright-report/
            coverage/
          retention-days: 7

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Update pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Test S3 Deployment
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Push test page to AWS S3
        env:
          APP_BUCKET: ${{ secrets.APP_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
        run: |
          mkdir -p dist
          printf '<h1>CloudFront deployment with GitHub Actions</h1>' > dist/index.html
          aws s3 cp dist "s3://${APP_BUCKET}" --recursive
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"